name: Nightly

# Tier 2 of the tiered pipeline: heavy checks that do not fit the MR
# budget (< 15 min) run here on a schedule and never gate a merge.
# - coverage: cargo llvm-cov over the whole workspace
# - miri: the pure stream-json (NDJSON) parser tests under Miri
# - fuzz: a 60-second smoke run of the NDJSON parser fuzz target
# The fourth heavy check, TruffleHog full-history with masked output,
# already runs weekly from secrets.yml (schedule-only) and stays there.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "llvm-tools-preview" }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-llvm-cov }
      - name: Coverage summary (workspace)
        shell: bash
        run: |
          set -o pipefail
          cargo llvm-cov --workspace --summary-only | tee coverage-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage-summary.txt
          retention-days: 14

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: "miri, rust-src" }
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: miri }
      - name: Miri on the pure NDJSON parser tests
        run: cargo +nightly miri test -p zen-cli --lib -- parse_event

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: fuzz }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-fuzz }
      # cargo-fuzz defaults to the target triple of the binary it was built
      # for: the musl binary cargo-binstall ships on the runner defaults to
      # x86_64-unknown-linux-musl, whose std is not installed there (E0463)
      # and whose static libc rejects AddressSanitizer. Pin the GNU target:
      # ASan needs the dynamically linked glibc std that ships by default.
      - name: Fuzz the NDJSON parser (60s smoke run)
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse_event_stream -- -max_total_time=60
