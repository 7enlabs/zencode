name: Windows test

# Free, no-card Windows test signal on a GitHub-hosted Windows Server
# runner. Complements PC testing (which needs a developer machine without
# an Application Control block on freshly built binaries): every PR and
# every push to main gets fmt + clippy + the full workspace test suite on
# Windows, without any paid runner or stored credential.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      powershell: ${{ steps.filter.outputs.powershell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/windows-test.yml'
            powershell:
              - 'install.ps1'
              - 'msix/build-msix.ps1'
              - '.github/workflows/windows-test.yml'
  windows-check:
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
  powershell-parse:
    # The two PowerShell scripts are user-facing entry points (the
    # one-command install and the MSIX packaging) but had no CI
    # validation at all: a syntax error would stay green here and
    # only fail on the next Windows user's machine (bug hunt D P2-4).
    needs: changes
    if: ${{ needs.changes.outputs.powershell == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($f in @('install.ps1', 'msix/build-msix.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $f), [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              foreach ($e in $errors) {
                Write-Host "::error file=$f,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host "$f parses cleanly"
            }
          }
          if ($failed) { exit 1 }
      - name: PSScriptAnalyzer (errors only, when available)
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Write-Host 'PSScriptAnalyzer is not on this runner image; skipping'
            return
          }
          $issues = Invoke-ScriptAnalyzer -Path 'install.ps1', 'msix/build-msix.ps1' -Severity Error
          if ($issues) {
            $issues | Format-Table -AutoSize | Out-String | Write-Host
            exit 1
          }
          Write-Host 'PSScriptAnalyzer: no errors'
