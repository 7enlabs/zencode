name: Secrets

# Split out of ci.yml (job "secrets") so the weekly schedule does not drag
# the whole Rust build along. The gitleaks job below is the ci.yml job
# moved verbatim; triggers mirror ci.yml plus a weekly schedule.
on:
  push:
    branches: [main, "feat/**", "fix/**", "dev/**", "lead/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
  schedule:
    # Weekly full-history scan on main (Mondays 03:17 UTC).
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    # Buffer task #8: full-history secret scan with Gitleaks. Reviewed
    # findings live in .gitleaksignore; the report is redacted and written
    # with owner-only permissions so it never exposes a secret value.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz (matches the release
      # gitleaks_8.30.1_checksums.txt). Bump both lines together.
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
      - name: Gitleaks (full history, redacted)
        shell: bash
        run: |
          umask 077
          ./gitleaks git --redact --no-banner --exit-code 1 -f sarif -r gitleaks.sarif .
      - name: Upload redacted report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif
          retention-days: 7

  trufflehog:
    # Layer 2 (design approved 2026-11-06): TruffleHog verifies candidate
    # secrets against provider APIs, so it must never run on PRs (it would
    # send candidate strings off-box and add noise/latency to the gate).
    # Schedule-only, on main, and it does not block merges.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRUFFLEHOG_VERSION: "3.99.8"
      # sha256 of trufflehog_3.99.8_linux_amd64.tar.gz (matches the release
      # trufflehog_3.99.8_checksums.txt; verified locally 2026-11-07).
      # Bump both lines together.
      TRUFFLEHOG_SHA256: "7c3b02f160f28929a467e29e20fba98746e0729f6e37c3c25761e4f8789abe08"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Install TruffleHog
        run: |
          curl -sSfL -o trufflehog.tgz "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  trufflehog.tgz" | sha256sum -c -
          tar xzf trufflehog.tgz trufflehog
      - name: TruffleHog (full history, verified+unknown only)
        shell: bash
        run: |
          umask 077
          ./trufflehog git file://. --results=verified,unknown --no-update --fail
