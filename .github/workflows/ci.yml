name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "dev/**", "lead/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Architectural lint (layers, runtime #[allow])
        run: python3 scripts/arch_lint.py
      - name: Self-test the architectural lint
        run: python3 -m unittest scripts/test_arch_lint.py
      - run: cargo test --workspace
  eval:
    # Deterministic eval gate (B7.1): the scripted mock solver needs no API key
    # and no network, so it runs on every PR including forks. Fails when any
    # built-in eval task fails (a broken task, check, tool or agent loop).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: zen eval (mock provider, pass rate must be 100%)
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked -q -p zen-cli -- eval --mock --min-pass-rate 1.0 | tee eval-report.md >> "$GITHUB_STEP_SUMMARY"
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-audit }
      - name: RustSec advisory audit
        run: cargo audit
      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            -L Cargo.lock

  # Secret scanning moved to .github/workflows/secrets.yml (weekly
  # schedule + TruffleHog layer 2); the job no longer lives here.
  deny:
    # Buffer task #8: cargo-deny. Advisories run apart from the rest so a new
    # RustSec advisory does not hide license, ban or source failures.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  build-linux:
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, test: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, test: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - if: matrix.zig
        run: |
          pip3 install --user --break-system-packages ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: cargo zigbuild --release -p zen-cli --target ${{ matrix.target }}
      - name: Smoke
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        run: ./target/${{ matrix.target }}/release/zen --version
      - uses: actions/upload-artifact@v4
        with:
          name: zen-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zen

  build:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, test: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, zig: false, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, zig: false, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, zig: false, test: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.target }}" }
      - if: matrix.zig
        run: |
          pip3 install --user --break-system-packages ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release -p zen-cli --target ${{ matrix.target }}
          else
            cargo build --release -p zen-cli --target ${{ matrix.target }}
          fi
      - name: Smoke
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        run: ./target/${{ matrix.target }}/release/zen${{ runner.os == 'Windows' && '.exe' || '' }} --version
      - name: Test (native runtime)
        if: matrix.test
        continue-on-error: true
        shell: bash
        run: cargo test --workspace --no-fail-fast --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: zen-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zen${{ runner.os == 'Windows' && '.exe' || '' }}
