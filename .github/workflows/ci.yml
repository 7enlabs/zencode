name: CI
on:
  push:
    branches: [main, "feat/**", "fix/**", "dev/**", "lead/**", "hotfix/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  # Tiered pipeline (buffer task): incremental artifacts bloat the
  # rust-cache and slow restores, and CI builds are one-shot anyway.
  CARGO_INCREMENTAL: "0"
jobs:
  changes:
    # Paths filter by PR type: the expensive cross-platform build
    # matrices only run when Rust code or the build config changed.
    # The check/eval/security/deny gates always run.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      installer: ${{ steps.filter.outputs.installer }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
              - '.github/workflows/windows-test.yml'
            installer:
              - 'install.ps1'
              - 'scripts/check_install_hash.py'
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Architectural lint (layers, runtime #[allow])
        run: python3 scripts/arch_lint.py
      - name: Self-test the architectural lint
        run: python3 -m unittest scripts/test_arch_lint.py
      - name: Self-test the install hash checker
        run: python3 -m unittest scripts/test_check_install_hash.py
      - run: cargo test --workspace
  install-hash:
    # Provenance gate for install.ps1 (bug hunt P1-2): the SHA-256 pinned
    # in install.ps1 must match the zen.exe inside the live release asset.
    # Runs only when the installer or this checker changes.
    if: ${{ needs.changes.outputs.installer == 'true' }}
    needs: [changes]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify install.ps1 pinned SHA-256 against the live release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_install_hash.py
  eval:
    # Deterministic eval gate (B7.1): the scripted mock solver needs no API key
    # and no network, so it runs on every PR including forks. Fails when any
    # built-in eval task fails (a broken task, check, tool or agent loop).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: zen eval (mock provider, pass rate must be 100%)
        shell: bash
        run: |
          set -o pipefail
          cargo run --locked -q -p zen-cli -- eval --mock --min-pass-rate 1.0 | tee eval-report.md >> "$GITHUB_STEP_SUMMARY"
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with: { tool: cargo-audit }
      - name: RustSec advisory audit
        run: cargo audit
      - name: OSV vulnerability scan
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            -L Cargo.lock

  # Secret scanning moved to .github/workflows/secrets.yml (weekly
  # schedule + TruffleHog layer 2); the job no longer lives here.
  deny:
    # Buffer task #8: cargo-deny. Advisories run apart from the rest so a new
    # RustSec advisory does not hide license, ban or source failures.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, "bans licenses sources"]
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check ${{ matrix.checks }}

  build-linux:
    if: ${{ needs.changes.outputs.rust == 'true' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}
    needs: [check, changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, test: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, test: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { key: "${{ matrix.target }}" }
      - if: matrix.zig
        run: |
          pip3 install --user --break-system-packages ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: cargo zigbuild --release -p zen-cli --target ${{ matrix.target }}
      - name: Smoke
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        run: ./target/${{ matrix.target }}/release/zen --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zen-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zen

  build:
    if: ${{ needs.changes.outputs.rust == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [check, changes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, test: false }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true, test: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, zig: false, test: true }
          - { os: macos-latest, target: aarch64-apple-darwin, zig: false, test: true }
          - { os: macos-latest, target: x86_64-apple-darwin, zig: false, test: false }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with: { targets: "${{ matrix.target }}" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { key: "${{ matrix.target }}" }
      - if: matrix.zig
        run: |
          pip3 install --user --break-system-packages ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.zig }}" = "true" ]; then
            cargo zigbuild --release -p zen-cli --target ${{ matrix.target }}
          else
            cargo build --release -p zen-cli --target ${{ matrix.target }}
          fi
      - name: Smoke
        if: matrix.target != 'aarch64-unknown-linux-musl'
        shell: bash
        run: ./target/${{ matrix.target }}/release/zen${{ runner.os == 'Windows' && '.exe' || '' }} --version
      - name: Test (native runtime)
        if: matrix.test
        continue-on-error: true
        shell: bash
        run: cargo test --workspace --no-fail-fast --target ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zen-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/zen${{ runner.os == 'Windows' && '.exe' || '' }}

  mutants:
    # Tier 1 (MR budget < 15 min): mutation-test only the lines the PR
    # changes, so the mutant count stays proportional to the diff.
    # Surviving mutants fail the job. The job gets its own rust-cache
    # namespace: it rebuilds the workspace per mutant batch and cannot
    # share the one-shot cache of the other jobs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with: { shared-key: mutants }
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with: { tool: cargo-mutants }
      - name: Diff against the PR base
        run: git diff ${{ github.event.pull_request.base.sha }}...HEAD > mutants.diff
      - name: cargo mutants --in-diff
        shell: bash
        run: |
          if [ ! -s mutants.diff ]; then
            echo "empty diff - no mutants to check"
            exit 0
          fi
          cargo mutants --in-diff mutants.diff
